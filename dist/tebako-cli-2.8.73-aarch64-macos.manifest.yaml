    # stage appends the platform's exe suffix to the path (.exe on
    # windows-ucrt — the image carries the PE name; empty elsewhere).
    - {name: "tebako", path: "/bin/tebako", version: "2.8.73"}
  libraries: []
  platforms: ["x86_64-linux-gnu","aarch64-linux-gnu","x86_64-linux-musl","aarch64-linux-musl","aarch64-macos","x86_64-macos","x86_64-windows-ucrt","aarch64-windows-ucrt"]
